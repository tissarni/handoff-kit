name: tests
on:
  push:
  pull_request:
permissions:
  contents: read
# A macOS job can take 60 minutes and GitHub Free runs 5 at a time: cancel a superseded run.
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true
jobs:
  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - run: bash tests/run.sh
  macos:
    runs-on: macos-latest
    # Advisory: the kit does not run on macOS yet, so a failure here must not fail the run.
    continue-on-error: true
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - name: Install bash and the GNU tools
        run: brew install bash coreutils findutils gnu-sed grep
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
      - run: bash tests/run.sh
